name: Windows runtime checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      # This test is independent of the game and needs no ROM or game assets.
      - run: cmake -S tests -B build-tests -A x64
      - run: cmake --build build-tests --config Release
      - run: ctest --test-dir build-tests -C Release --output-on-failure
